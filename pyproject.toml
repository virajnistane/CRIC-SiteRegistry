[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["site_registry*", "sites*"]

[project]
name = "cric-site-registry"
version = "0.1.0"
description = "Computing Resource Information Catalogue - A Django REST API for managing infrastructure site registrations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.3",
    "django-stubs>=6.0.1",
    "djangorestframework>=3.17.0",
    "djangorestframework-stubs>=3.16.8",
    "psycopg2-binary>=2.9.11",
    "gunicorn>=24.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.15.7",
]

desktop = [
    "PyQt6>=6.7",
    "httpx>=0.28",
    "qasync>=0.27",
    "pytest-qt>=4.4",
]

cpp = [
    "pybind11>=3.0.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
